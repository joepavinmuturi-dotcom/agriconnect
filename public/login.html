<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Login | AgriConnect</title>
<link rel='stylesheet' href='css/style.css'>
</head>
<body data-page='login'>
<header class='site' id='site-header'></header>
<main class='container'>
  <form class='panel' id='form'>
    <h1>Login</h1>
    <div id='msg'></div>
    <label for='email'>Email</label><input id='email' name='email' type='email' required>
    <label for='password'>Password</label><input id='password' name='password' type='password' required>
    <p><button class='btn' type='submit'>Login</button></p>
    <p>New here? <a href='register.html'>Create an account</a></p>
  </form>
</main>
<footer class='site' id='site-footer'></footer>
<script src='js/app.js'></script>
</body>
</html>
