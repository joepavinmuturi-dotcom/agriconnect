<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Register | AgriConnect</title>
<link rel='stylesheet' href='css/style.css'>
</head>
<body data-page='register'>
<header class='site' id='site-header'></header>
<main class='container'>
  <form class='panel' id='form'>
    <h1>Create account</h1>
    <div id='msg'></div>
    <label for='name'>Full name</label><input id='name' name='name' maxlength='60' required>
    <label for='email'>Email</label><input id='email' name='email' type='email' required>
    <label for='phone'>Phone</label><input id='phone' name='phone' maxlength='20'>
    <label for='location'>Location</label><input id='location' name='location' maxlength='80'>
    <label for='role'>I am a</label>
    <select id='role' name='role'><option value='buyer'>Buyer</option><option value='farmer'>Farmer</option></select>
    <label for='password'>Password</label><input id='password' name='password' type='password' minlength='8' required>
    <label for='confirm'>Confirm password</label><input id='confirm' name='confirm' type='password' required>
    <p><button class='btn' type='submit'>Register</button></p>
    <p>Already registered? <a href='login.html'>Login</a></p>
  </form>
</main>
<footer class='site' id='site-footer'></footer>
<script src='js/app.js'></script>
</body>
</html>
