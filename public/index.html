<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Home | AgriConnect</title>
<link rel='stylesheet' href='css/style.css'>
</head>
<body data-page='home'>
<header class='site' id='site-header'></header>
<section class='hero'>
  <h1>Fresh produce, straight from the farmer</h1>
  <p>Households, hotels, schools and exporters buy directly from smallholder farmers.</p>
  <form action='catalogue.html' method='get' class='filters center'>
    <input name='search' placeholder='Search tomatoes, kale, maize...' maxlength='60'>
    <button class='btn' type='submit'>Search</button>
  </form>
  <a class='btn amber' href='catalogue.html'>Browse the catalogue</a>
</section>
<main class='container'>
  <h2>Categories</h2>
  <div id='cats'></div>
  <h2>Featured produce</h2>
  <div class='grid' id='featured'></div>
</main>
<footer class='site' id='site-footer'></footer>
<script src='js/app.js'></script>
</body>
</html>
