<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Produce Catalogue | AgriConnect</title>
<link rel='stylesheet' href='css/style.css'>
</head>
<body data-page='catalogue'>
<header class='site' id='site-header'></header>
<main class='container'>
  <h1>Produce catalogue</h1>
  <form class='filters' id='filters'>
    <input id='search' placeholder='Search by name or location' maxlength='60'>
    <select id='category'></select>
    <input id='max' type='number' min='1' placeholder='Max price (KES)'>
    <button class='btn' type='submit'>Filter</button>
  </form>
  <div class='grid' id='results'></div>
</main>
<footer class='site' id='site-footer'></footer>
<script src='js/app.js'></script>
</body>
</html>
