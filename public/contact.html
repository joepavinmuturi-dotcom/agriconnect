<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Contact Us | AgriConnect</title>
<link rel='stylesheet' href='css/style.css'>
</head>
<body data-page='contact'>
<header class='site' id='site-header'></header>
<main class='container'>
  <form class='panel' id='form'>
    <h1>Contact us</h1>
    <div id='msg'></div>
    <label for='name'>Your name</label><input id='name' name='name' maxlength='60' required>
    <label for='email'>Email</label><input id='email' name='email' type='email' required>
    <label for='message'>Message</label><textarea id='message' name='message' rows='4' maxlength='500' required></textarea>
    <p><button class='btn' type='submit'>Send</button></p>
    <p class='muted'>Phone: +254 700 000 000 &middot; Email: info@agriconnect.example</p>
  </form>
</main>
<footer class='site' id='site-footer'></footer>
<script src='js/app.js'></script>
</body>
</html>
