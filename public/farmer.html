<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>My Produce | AgriConnect</title>
<link rel='stylesheet' href='css/style.css'>
</head>
<body data-page='farmer'>
<header class='site' id='site-header'></header>
<main class='container'>
  <h1>My produce</h1>
  <div id='msg'></div>
  <form class='panel wide' id='form'>
    <h2>Add or edit produce</h2>
    <label for='name'>Produce name</label><input id='name' name='name' maxlength='80' required>
    <label for='category'>Category</label><select id='category' name='category_id'></select>
    <label for='price'>Price (KES)</label><input id='price' name='price' type='number' min='1' step='0.01' required>
    <label for='quantity'>Quantity available</label><input id='quantity' name='quantity' type='number' min='0' step='1' required>
    <label for='unit'>Unit</label><input id='unit' name='unit' value='kg' maxlength='15'>
    <label for='location'>Location</label><input id='location' name='location' maxlength='80'>
    <label for='description'>Description</label><textarea id='description' name='description' rows='3' maxlength='500'></textarea>
    <label for='photo'>Photo (JPG, PNG or WebP, max 2 MB)</label><input id='photo' name='photo' type='file' accept='image/jpeg,image/png,image/webp'>
    <p><button class='btn' id='save' type='submit'>Save listing</button></p>
  </form>
  <h2>My listings</h2>
  <div id='mine'></div>
</main>
<footer class='site' id='site-footer'></footer>
<script src='js/app.js'></script>
</body>
</html>
